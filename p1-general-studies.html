<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf6f0">
<meta name="robots" content="noindex">
<title>小一常識・溫習小花園</title>
<style>
:root { color-scheme: light; --ink:#203e35; --green:#17664f; --muted:#567065; --line:#c8dcd0; --paper:#fff; font-family:"PingFang TC","Microsoft JhengHei",sans-serif; color:var(--ink); background:#edf6f0; }
* { box-sizing:border-box; } [hidden] { display:none!important; }
body { margin:0; } main { max-width:1000px; margin:auto; padding:24px; }
button { font:inherit; color:inherit; background:#fff; border:1.5px solid var(--line); border-radius:14px; min-height:50px; padding:10px 17px; font-weight:700; cursor:pointer; touch-action:manipulation; }
button:hover { border-color:var(--green); } button:focus-visible { outline:3px solid #aa6500; outline-offset:3px; }
button:disabled { opacity:.5; cursor:default; } h1,h2,h3,p { margin:0; }
h1 { font-size:clamp(1.8rem,4vw,2.5rem); letter-spacing:.04em; } h2 { font-size:1.25rem; }
.kicker { font-weight:800; font-size:.85rem; letter-spacing:.12em; color:var(--green); margin-bottom:5px; }
.topbar,.toolbar,.nav-buttons,.status,.result-actions { display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; }
.topbar { margin-bottom:22px; } .subtle { color:var(--muted); font-size:1rem; line-height:1.7; }
.panel { background:var(--paper); padding:clamp(18px,3vw,30px); border:1px solid var(--line); border-radius:25px; box-shadow:0 8px 24px #203e3509; }
.welcome { padding-bottom:22px; } .welcome h2 { font-size:1.6rem; margin-bottom:8px; }
.topic-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.topic { display:flex; text-align:left; align-items:center; gap:14px; padding:22px; min-height:108px; border-radius:20px; }
.topic strong { display:block; font-size:1.35rem; margin-bottom:4px; } .topic small { font-size:.95rem; color:var(--muted); }
.topic .icon { font-size:2.3rem; width:48px; text-align:center; }
.topic.mixed { grid-column:1/-1; background:var(--green); color:white; } .topic.mixed small { color:#e3f1e8; }
.instructions { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:18px; color:var(--muted); line-height:1.6; }
.instructions span { white-space:nowrap; }
.small-button { min-height:44px; font-size:.95rem; padding:7px 12px; background:transparent; }
.primary { background:var(--green); color:white; border-color:var(--green); }
.pill { font-size:.85rem; padding:5px 10px; border-radius:50px; background:#edf6f0; }
.progress { height:7px; width:100%; background:#e6eee9; margin:14px 0 12px; border-radius:10px; overflow:hidden; }
.progress span { display:block; height:100%; width:0; background:var(--green); transition:width .15s; }
.steps { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
.step { padding:0; min-height:45px; border-radius:10px; } .step.done { background:#e8f4ed; }
.step[aria-current] { background:var(--green); color:white; }
.question-title { margin:22px 0 12px; font-size:clamp(1.3rem,2.8vw,1.65rem); line-height:1.8; font-weight:700; overflow-wrap:anywhere; }
.question-layout { display:grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap:22px; align-items:start; }
.question-layout.no-image { grid-template-columns:1fr; }
.picture { background:#fafbf8; border:1px solid #e4eade; border-radius:16px; padding:10px; text-align:center; }
.picture img { display:block; max-width:100%; max-height:310px; width:auto; height:auto; margin:auto; border-radius:8px; }
.picture button { margin-top:6px; min-height:38px; padding:4px 12px; font-size:.9rem; }
.choices { display:grid; gap:9px; } .choice { text-align:left; font-size:1.15rem; line-height:1.6; padding:11px 15px; }
.choice[aria-pressed="true"] { background:#fff0cf; border-color:#a66907; color:#67400b; }
.choice .marker { display:inline-flex; width:25px; height:25px; border:1.5px solid #8aa497; border-radius:50%; align-items:center; justify-content:center; margin-right:9px; font-size:.9rem; }
.choice[aria-pressed="true"] .marker { background:#926012; color:#fff; border-color:#926012; }
.word-bank { background:#f4f8f3; padding:13px; border-radius:15px; } .word-bank h3 { font-size:.95rem; margin-bottom:9px; }
.words { display:flex; flex-wrap:wrap; gap:9px; } .word { font-size:1.2rem; min-width:70px; }
.blank { display:inline-block; min-width:3.7em; min-height:46px; padding:0 6px; margin:2px 4px; vertical-align:baseline; font-size:inherit; line-height:1.5; border:2px dashed #6c8d80; border-radius:9px; color:#496b5e; }
.blank.filled { border-style:solid; background:#edf6f0; } .blank[aria-pressed="true"] { background:#fff0cf; border-color:#a66907; color:#67400b; }
.blank:disabled { opacity:1; color:var(--green); border-style:solid; }
.feedback { color:var(--muted); min-height:1.7em; line-height:1.6; margin:15px 0 0; }
.toolbar { margin-top:18px; } .nav-buttons { justify-content:flex-start; }
.order-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:13px; padding:12px; background:#edf6f0; border-radius:14px; min-height:59px; align-items:center; }
.order-token { font-size:1.05rem; background:white; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
.order-actions { display:flex; gap:8px; margin-top:12px; }
.score { font-size:clamp(2rem,6vw,3.5rem); color:var(--green); font-weight:800; margin:8px 0; }
.review-list { display:grid; gap:10px; margin:18px 0; } .review-card { background:#f5f8f4; border:1px solid #dce6dc; border-radius:13px; padding:14px; }
.review-card strong { display:block; margin-bottom:5px; } .review-card p { line-height:1.7; }
.review-card .my-answer { color:#80501b; margin-top:5px; }
.result-actions { justify-content:flex-start; }
dialog { padding:16px; max-width:calc(100vw - 24px); max-height:95vh; border:1px solid var(--line); border-radius:18px; }
dialog::backdrop { background:#14332999; } dialog img { display:block; max-width:100%; max-height:77vh; margin:12px auto 0; }
footer { margin-top:20px; color:var(--muted); font-size:.85rem; text-align:center; line-height:1.6; }
@media(max-width:650px) { main { padding:16px; } .question-layout { grid-template-columns:1fr; gap:14px; } .picture img { max-height:215px; } .topic { padding:16px; min-height:100px; gap:7px; } .topic strong { font-size:1.12rem; } .topic .icon { font-size:1.8rem; width:34px; } .steps { grid-template-columns:repeat(5,1fr); } }
@media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div><p class="kicker">小一常識 · 第 4 至 7 課</p><h1>溫習小花園</h1></div>
    <button id="home-button" class="small-button" hidden>選課題</button>
  </header>
  <section id="home" class="panel" aria-labelledby="welcome-title">
    <div class="welcome"><h2 id="welcome-title" tabindex="-1">今天想溫習甚麼？</h2><p class="subtle">每輪 10 題，慢慢想，再點選答案。</p></div>
    <div id="topics" class="topic-grid"></div>
    <div class="instructions"><span>① 選課題</span><span>② 點選作答</span><span>③ 做完交卷</span><span>④ 重做錯題</span></div>
  </section>
  <section id="practice" class="panel" hidden aria-labelledby="question-number">
    <div class="status"><h2 id="question-number" tabindex="-1"></h2><span id="topic-label" class="pill"></span><span id="progress-label" class="subtle"></span></div>
    <div class="progress" role="progressbar" aria-label="已完成題數" aria-valuemin="0" aria-valuemax="10" id="progress"><span id="progress-fill"></span></div>
    <nav id="steps" class="steps" aria-label="跳到指定題目"></nav>
    <p id="prompt" class="question-title"></p>
    <div id="question-layout" class="question-layout">
      <div id="picture" class="picture" hidden><img id="question-image" alt=""><button id="zoom-button" type="button">放大圖片</button></div>
      <div id="answer-area"></div>
    </div>
    <p id="feedback" class="feedback" role="status"></p>
    <div class="toolbar"><div class="nav-buttons"><button id="previous">上一題</button><button id="next">下一題</button></div><button id="submit" class="primary">交卷</button><button id="restart" class="small-button">↻ 重新開始</button></div>
  </section>
  <section id="results" class="panel" hidden aria-labelledby="result-title">
    <h2 id="result-title" tabindex="-1">這一輪的成果</h2><p id="score" class="score"></p><p id="result-text" class="subtle"></p>
    <div id="review-list" class="review-list"></div>
    <div class="result-actions"><button id="retry" class="primary">只重做錯題</button><button id="again">再抽 10 題</button><button id="choose-topic">選其他課題</button></div>
  </section>
  <footer>按提供的常識範圍第 10–21 頁改編 · 重新開始會清空本輪答案</footer>
</main>
<dialog id="image-dialog" aria-label="放大題目圖片"><button id="close-image">關閉圖片</button><img id="large-image" alt=""></dialog>

const el = id => document.getElementById(id);
let selectedTopic = 'all';
let round = [];
let visible = [];
let position = 0;
let activeBlank = -1;
let wrong = [];
let lastTopicOffset = 0;
const previousDraws = new Map();

function shuffled(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function makeButton(text, className, action) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = text;
  button.className = className;
  button.addEventListener('click', action);
  return button;
}

function drawQuestions(pool, count, historyKey) {
  const previous = previousDraws.get(historyKey) || [];
  const fresh = shuffled(pool.filter(q => !previous.includes(q.id)));
  const rest = shuffled(pool.filter(q => previous.includes(q.id)));
  const picked = [...fresh, ...rest].slice(0, count);
  previousDraws.set(historyKey, picked.map(q => q.id));
  return picked;
}

function pickRound(topic) {
  if (topic !== 'all') return drawQuestions(bank.filter(q => q.topic === topic), 10, topic);
  const picked = topics.flatMap((item, index) => {
    const relativeIndex = (index + lastTopicOffset) % topics.length;
    return drawQuestions(bank.filter(q => q.topic === item.id), relativeIndex < 2 ? 3 : 2, `all-${item.id}`);
  });
  lastTopicOffset = (lastTopicOffset + 1) % topics.length;
  return shuffled(picked);
}

function showPanel(name) {
  for (const id of ['home', 'practice', 'results']) el(id).hidden = id !== name;
  el('home-button').hidden = name === 'home';
}

function startRound(topic) {
  selectedTopic = topic;
  round = pickRound(topic).map((question, index) => ({
    question,
    number: index + 1,
    choices: shuffled(question.choices),
    values: question.type === 'fill' ? question.answer.map(() => '') : [],
    locked: question.answer.map(() => false)
  }));
  visible = round;
  wrong = [];
  showPanel('practice');
  openQuestion(0);
}

function isFilled(item) {
  if (item.question.type === 'fill') return item.values.every(Boolean);
  if (item.question.type === 'order') return item.values.length === item.question.answer.length;
  return item.values.length > 0;
}

function isCorrect(item) {
  const key = item.question.answer;
  if (item.question.type === 'multi') {
    return item.values.length === key.length && key.every(word => item.values.includes(word));
  }
  return item.values.length === key.length && key.every((word, i) => word === item.values[i]);
}

function openQuestion(index) {
  position = index;
  activeBlank = -1;
  renderQuestion();
  const type = visible[position].question.type;
  el('feedback').textContent = ({ fill: '先點空格，再點詞語。', order: '按先後次序點選。點「退一步」可以修改。', multi: '可以選多項，再點一次可以取消。', single: '點一下你選的答案。' })[type];
  el('question-number').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderQuestion() {
  const item = visible[position];
  const q = item.question;
  const complete = round.filter(isFilled).length;
  el('question-number').textContent = `第 ${item.number} 題`;
  el('topic-label').textContent = topics.find(topic => topic.id === q.topic).name;
  el('progress-label').textContent = `已填 ${complete}／10 題`;
  el('progress').setAttribute('aria-valuenow', complete);
  el('progress-fill').style.width = `${complete * 10}%`;
  el('steps').replaceChildren(...visible.map((entry, i) => {
    const step = makeButton(entry.number, `step${isFilled(entry) ? ' done' : ''}`, () => openQuestion(i));
    step.setAttribute('aria-label', `第 ${entry.number} 題，${isFilled(entry) ? '已填' : '未完成'}`);
    if (i === position) step.setAttribute('aria-current', 'step');
    return step;
  }));
  el('previous').disabled = position === 0;
  el('next').disabled = position === visible.length - 1;
  el('picture').hidden = !q.image;
  el('question-layout').className = q.image ? 'question-layout' : 'question-layout no-image';
  if (q.image) {
    el('question-image').src = assets[q.image];
    el('question-image').alt = q.alt;
  }
  el('prompt').replaceChildren();
  el('answer-area').replaceChildren();
  if (q.type === 'fill') renderFill(item);
  else {
    el('prompt').textContent = q.prompt;
    if (q.type === 'order') renderOrder(item);
    else renderChoices(item);
  }
}

function renderFill(item) {
  const q = item.question;
  q.prompt.split('＿').forEach((part, i) => {
    if (i > 0) {
      const index = i - 1;
      const value = item.values[index];
      const blank = makeButton(value || '＿＿', `blank${value ? ' filled' : ''}`, () => {
        activeBlank = index;
        renderQuestion();
        el('feedback').textContent = `已選第 ${i} 個空格，請點詞語。`;
        el('answer-area').querySelector('.word').focus({ preventScroll: true });
      });
      blank.disabled = item.locked[index];
      blank.setAttribute('aria-label', `第 ${i} 個空格，${value || '未填'}${blank.disabled ? '，已答對' : ''}`);
      blank.setAttribute('aria-pressed', String(activeBlank === index));
      el('prompt').append(blank);
    }
    el('prompt').append(part);
  });
  const box = document.createElement('div');
  box.className = 'word-bank';
  const title = document.createElement('h3');
  title.textContent = '詞語框';
  const words = document.createElement('div');
  words.className = 'words';
  words.append(...item.choices.map(word => makeButton(word, 'word', () => {
    if (activeBlank < 0) {
      el('feedback').textContent = '請先點句子中的空格。';
      el('prompt').querySelector('.blank:not(:disabled)').focus({ preventScroll: true });
      return;
    }
    const index = activeBlank;
    item.values[index] = word;
    activeBlank = -1;
    renderQuestion();
    el('feedback').textContent = `已填入「${word}」。再點空格可以修改。`;
    el('prompt').querySelectorAll('.blank')[index].focus({ preventScroll: true });
  })));
  box.append(title, words);
  el('answer-area').append(box);
}

function renderChoices(item) {
  const multiple = item.question.type === 'multi';
  const group = document.createElement('div');
  group.className = 'choices';
  group.setAttribute('role', 'group');
  group.setAttribute('aria-label', multiple ? '可選多項的答案' : '請選一個答案');
  group.append(...item.choices.map(word => {
    const chosen = item.values.includes(word);
    const choice = makeButton('', 'choice', () => {
      if (multiple) {
        item.values = item.values.includes(word) ? item.values.filter(value => value !== word) : [...item.values, word];
      } else item.values = [word];
      renderQuestion();
      el('feedback').textContent = multiple ? `已選 ${item.values.length} 項。再點一次可以取消。` : '已選好。可以繼續下一題，也可以更改答案。';
      el('answer-area').querySelectorAll('.choice')[item.choices.indexOf(word)].focus({ preventScroll: true });
    });
    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.setAttribute('aria-hidden', 'true');
    marker.textContent = chosen ? '✓' : '';
    choice.append(marker, word);
    choice.setAttribute('aria-pressed', String(chosen));
    return choice;
  }));
  el('answer-area').append(group);
}

function renderOrder(item) {
  const list = document.createElement('div');
  list.className = 'order-list';
  list.setAttribute('aria-label', '已排列的成長階段');
  if (!item.values.length) list.textContent = '從第一個階段開始點選 ↓';
  item.values.forEach((word, i) => {
    const token = document.createElement('span');
    token.className = 'order-token';
    token.textContent = `${i + 1}. ${word}`;
    list.append(token);
  });
  const words = document.createElement('div');
  words.className = 'words';
  words.append(...item.choices.map(word => {
    const choice = makeButton(word, 'word', () => {
      item.values.push(word);
      renderQuestion();
      el('feedback').textContent = `已選 ${item.values.length}／${item.question.answer.length} 個階段。`;
      const next = el('answer-area').querySelector('.word:not(:disabled)') || el('next');
      next.focus({ preventScroll: true });
    });
    choice.disabled = item.values.includes(word);
    return choice;
  }));
  const actions = document.createElement('div');
  actions.className = 'order-actions';
  const undo = makeButton('退一步', 'small-button', () => { item.values.pop(); renderQuestion(); });
  undo.disabled = item.values.length === 0;
  actions.append(undo);
  el('answer-area').append(list, words, actions);
}

function answerText(item) {
  return item.values.filter(Boolean).join(item.question.type === 'order' ? ' → ' : '、') || '未填';
}

function grade() {
  const incomplete = visible.findIndex(item => !isFilled(item));
  if (incomplete !== -1) {
    openQuestion(incomplete);
    el('feedback').textContent = '這題還未完成。每題都選好答案，便可以交卷。';
    return;
  }
  wrong = round.filter(item => !isCorrect(item));
  for (const item of round) item.locked = item.question.answer.map((answer, i) => item.values[i] === answer);
  showPanel('results');
  el('score').textContent = `${10 - wrong.length}／10 題答對`;
  el('result-text').textContent = wrong.length ? '看看這幾題，再試一次吧。已答對的填充空格會保留。' : '這一輪全部答對了！可以再抽一輪，或選其他課題。';
  el('retry').hidden = wrong.length === 0;
  el('review-list').replaceChildren(...wrong.map(item => {
    const card = document.createElement('div');
    card.className = 'review-card';
    const title = document.createElement('strong');
    title.textContent = `第 ${item.number} 題 · ${topics.find(topic => topic.id === item.question.topic).name}`;
    const prompt = document.createElement('p');
    prompt.textContent = item.question.prompt.replaceAll('＿', '＿＿');
    const mine = document.createElement('p');
    mine.className = 'my-answer';
    mine.textContent = `你選了「${answerText(item)}」`;
    card.append(title, prompt, mine);
    return card;
  }));
  el('result-title').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function goHome() {
  showPanel('home');
  el('welcome-title').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

el('previous').addEventListener('click', () => openQuestion(position - 1));
el('next').addEventListener('click', () => openQuestion(position + 1));
el('submit').addEventListener('click', grade);
el('home-button').addEventListener('click', goHome);
el('choose-topic').addEventListener('click', goHome);
el('restart').addEventListener('click', () => startRound(selectedTopic));
el('again').addEventListener('click', () => startRound(selectedTopic));
el('retry').addEventListener('click', () => {
  for (const item of wrong) {
    item.values = item.question.type === 'fill' ? item.values.map((word, i) => item.locked[i] ? word : '') : [];
  }
  visible = wrong;
  showPanel('practice');
  openQuestion(0);
  el('feedback').textContent = '請重做餘下的錯題。已答對的填充空格會保留。';
});
el('zoom-button').addEventListener('click', () => {
  const q = visible[position].question;
  el('large-image').src = assets[q.image];
  el('large-image').alt = q.alt;
  el('image-dialog').showModal();
});
el('close-image').addEventListener('click', () => el('image-dialog').close());

</script>
</body>
</html>
